<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f6f8">
<title>זריז · מקצוענים וסידורים בקליק</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff6a00'/%3E%3Cpath fill='%23fff' d='M32 8c-10.5 0-19 8.3-19 18.6C13 40 32 56 32 56s19-16 19-29.4C51 16.300 42.500 8 32 8z'/%3E%3Cpath fill='%23ff6a00' d='M35 15 24 31h8l-3 14 12-17h-8z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
  /* Built for everyone, including older users: one font, large text, strong contrast,
     one question per screen and big tap targets. */
  :root{color-scheme:light;--bg:#f6f6f8;--card:#fff;--ink:#14161f;--muted:#4f5568;--line:#d9dce5;--chip:#eceef3;
    --brand:#ff6a00;--btn:#cf5200;--brand-ink:#a83a00;--brand-soft:#fff1e6;
    --ok:#0f7a4a;--ok-soft:#e2f4ea;--err:#c8102e;--err-soft:#fde8ec;
    --font:"Rubik","Assistant",system-ui,sans-serif}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.5;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  body.nonav{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--brand-ink)}
  svg.i{flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  [hidden]{display:none!important}
  .app{max-width:560px;margin:0 auto}
  .muted{color:var(--muted);font-size:16px}
  .ltr{direction:ltr;unicode-bidi:isolate}
  main{padding:4px 18px 24px}
  h1{font-size:30px;font-weight:700;line-height:1.2;margin:10px 0 18px}
  h2{font-size:22px;font-weight:700;margin:26px 0 12px}

  /* top bar */
  .top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;min-height:68px;padding:10px 18px;background:rgba(246,246,248,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .top .brand{flex:1;display:flex;align-items:center;gap:10px;font-weight:800;font-size:28px;color:var(--brand);letter-spacing:-.5px}
  .lgm{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(150deg,#ff8a2a,#e85a00);color:#e85a00;flex:none;box-shadow:0 6px 14px -6px rgba(232,90,0,.7)}
  .lgm svg{width:28px;height:28px}
  .lgm.big{width:64px;height:64px;border-radius:20px}.lgm.big svg{width:42px;height:42px}
  .qban{display:flex;align-items:center;gap:14px;width:100%;text-align:right;border:0;border-radius:22px;padding:16px 18px;margin:14px 0 4px;background:linear-gradient(135deg,#fff1e6,#ffe0c7);color:var(--ink);cursor:pointer}
  .qban b{display:block;font-size:20px;line-height:1.25}.qban small{display:block;font-size:16px;color:#6b4a30;margin-top:3px}
  .qban svg{flex:none}
  .promo{text-align:center;padding-top:6px}.promo h2{font-size:26px;line-height:1.2;margin:14px 0 8px}.promo p{font-size:18px;line-height:1.45;margin:0 0 18px;color:var(--muted)}
  .top .title{flex:1;font-weight:700;font-size:22px}
  .back{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 16px 0 18px;border-radius:24px;border:2px solid var(--line);background:var(--card);font-weight:500;font-size:18px;cursor:pointer}

  /* buttons and fields */
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;border:0;border-radius:18px;background:var(--btn);color:#fff;font-weight:700;font-size:20px;cursor:pointer;text-decoration:none;padding:0 18px}
  .btn.ok{background:var(--ok)}
  .btn.soft{background:var(--card);color:var(--ink);border:2px solid var(--line)}
  .btn.line{background:var(--card);color:var(--brand-ink);border:2px solid var(--brand)}
  .btn:disabled{opacity:.5;cursor:default}
  .field{width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;min-height:60px;font-size:20px}
  .field::placeholder{color:#7c8296}
  .field:focus{outline:3px solid var(--brand);outline-offset:1px;border-color:transparent}
  .field.bad{border-color:var(--err)}
  textarea.field{resize:none;min-height:140px;line-height:1.45}
  input[type=number].field{-moz-appearance:textfield}
  input[type=number].field::-webkit-inner-spin-button,input[type=number].field::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  label.lb{display:block;font-weight:700;font-size:19px;margin:20px 0 8px}
  .opt{font-weight:400;color:var(--muted);font-size:16px}
  .err{color:var(--err);font-size:17px;font-weight:500;margin-top:6px}
  .err:empty{display:none}
  .card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:12px}

  /* choices: one big row per option, no tiles */
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:12px 16px;border-radius:20px;border:2px solid var(--line);background:var(--card);text-align:right;cursor:pointer}
  .choice:active{border-color:var(--brand);background:var(--brand-soft)}
  .choice.plain{min-height:66px}
  .choice .ico{width:50px;height:50px;border-radius:25px;background:var(--brand-soft);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;flex:none}
  .choice .ico.red{background:var(--err-soft);color:var(--err)}
  .choice .txt{flex:1;min-width:0;display:flex;flex-direction:column}
  .choice b{font-size:20px;font-weight:500;line-height:1.3}
  .choice small{font-size:16px;color:var(--muted)}
  .choice .go{color:#8a90a3}
  .choice.on{border-color:var(--brand);background:var(--brand-soft)}
  .choice .radio{width:28px;height:28px;border-radius:14px;border:2px solid #9aa0b3;flex:none;display:flex;align-items:center;justify-content:center}
  .choice.on .radio{border-color:var(--btn);background:var(--btn);color:#fff}
  .search{display:flex;align-items:center;gap:10px;min-height:60px;border-radius:18px;background:var(--card);border:2px solid var(--line);padding:0 16px;color:#6b7186}
  .search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:19px;color:var(--ink)}
  .search:focus-within{outline:3px solid var(--brand);outline-offset:1px;border-color:transparent}

  /* steps */
  .stepinfo{display:flex;align-items:center;gap:12px;margin:4px 0 2px;font-size:16px;color:var(--muted)}
  .bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
  .bar span{display:block;height:100%;background:var(--brand);border-radius:4px}
  .cta{position:fixed;inset-inline:0;bottom:0;z-index:40;max-width:560px;margin:0 auto;padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(246,246,248,0),var(--bg) 28%)}
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .ph{position:relative}
  .ph .rm{position:absolute;top:-6px;left:-6px;width:32px;height:32px;border-radius:16px;background:var(--ink);color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:2}
  .addph{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:18px;border:2px dashed #9aa0b3;background:var(--card);font-weight:500;font-size:19px;cursor:pointer;margin-top:18px}
  .addph input{display:none}
  .sum{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .sum:last-child{border-bottom:0}
  .sum>svg{color:var(--brand-ink);margin-top:3px}
  .sum span{display:block;font-size:16px;color:var(--muted)}
  details.more{margin-top:18px}
  details.more summary{min-height:52px;display:flex;align-items:center;gap:8px;font-weight:500;color:var(--brand-ink);cursor:pointer;list-style:none}
  details.more summary::-webkit-details-marker{display:none}
  .check{display:flex;gap:14px;align-items:flex-start;padding:12px 0;cursor:pointer}
  .check input{width:28px;height:28px;accent-color:var(--btn);margin:2px 0 0;flex:none}

  /* media */
  .mthumbs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
  .mthumb{position:relative;padding:0;margin:0;border:0;border-radius:14px;overflow:hidden;background:#222;cursor:pointer;flex:0 0 auto}
  .mthumb img,.mthumb video{width:100%;height:100%;object-fit:cover;display:block}
  .mplay{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:#0004}
  .lightbox{position:fixed;inset:0;z-index:99;background:#000e;display:grid;place-items:center;padding:16px}
  .lightbox img,.lightbox video{max-width:100%;max-height:calc(100% - 96px);border-radius:12px}
  .lbclose{position:absolute;top:14px;left:14px;width:52px;height:52px;border-radius:26px;background:#fff3;color:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}

  /* requests */
  .req{display:flex;flex-direction:column;gap:6px;width:100%;text-align:right;cursor:pointer;font:inherit}
  .req b{font-size:20px;font-weight:700}
  .req .desc{font-size:17px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status{display:flex;align-items:center;gap:10px;font-weight:500;font-size:18px}
  .status i{width:12px;height:12px;border-radius:6px;background:var(--brand);flex:none}
  .status.wait i{background:#9aa0b3} .status.ok i{background:var(--ok)} .status.err i{background:var(--err)}
  .status.act{color:var(--brand-ink)}
  .bigstatus{font-size:24px;font-weight:700;line-height:1.3;margin:6px 0 14px}
  .timeline{list-style:none;margin:0;padding:0}
  .timeline li{display:flex;gap:14px;align-items:center;min-height:48px;font-size:18px;color:var(--muted);position:relative}
  .timeline li::before{content:"";position:absolute;right:13px;top:36px;bottom:-12px;width:2px;background:var(--line)}
  .timeline li:last-child::before{display:none}
  .timeline .dot{width:28px;height:28px;border-radius:14px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex:none;z-index:1}
  .timeline li.done{color:var(--ink)} .timeline li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
  .timeline li.cur{color:var(--ink);font-weight:700} .timeline li.cur .dot{border-color:var(--brand);border-width:3px}
  .timeline li.now .dot{background:var(--brand);box-shadow:0 0 0 5px var(--brand-soft)}
  .offer{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
  .offer.won{border-color:var(--ok)}
  .offer .who{display:flex;gap:12px;align-items:center}
  .av{width:52px;height:52px;border-radius:26px;background:var(--brand-soft);color:var(--brand-ink);font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
  .price{font-size:28px;font-weight:700;white-space:nowrap}
  .line{display:flex;gap:8px;align-items:center;font-size:17px;margin-top:8px}
  .item{background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:16px;display:flex;gap:10px;align-items:flex-start}
  .stars{display:flex;justify-content:center;gap:4px}
  .stars button{width:56px;height:56px;border:0;background:none;color:var(--brand);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  .empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:18px}
  .empty svg{color:#9aa0b3;margin-bottom:10px}
  .empty b{display:block;color:var(--ink);font-size:22px;margin-bottom:6px}
  .done-ic{width:84px;height:84px;border-radius:42px;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:10px auto 6px}

  /* bottom nav: three tabs */
  nav.bottom{position:fixed;inset-inline:0;bottom:0;z-index:40;max-width:560px;margin:0 auto;height:calc(84px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:2px solid var(--line)}
  nav.bottom button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:none;color:var(--muted);font-weight:500;font-size:16px;cursor:pointer;position:relative}
  nav.bottom button.on{color:var(--brand-ink);font-weight:700}
  nav.bottom button.on::before{content:"";position:absolute;top:0;width:56px;height:4px;border-radius:0 0 4px 4px;background:var(--brand)}
  .badge{position:absolute;top:6px;left:50%;margin-left:8px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--err);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;font-style:normal}

  /* sheet + toast */
  .scrim{position:fixed;inset:0;z-index:60;background:rgba(10,12,20,.55);display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:560px;max-height:calc(100% - 24px);overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:12px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
  .sheet .handle{width:44px;height:5px;border-radius:3px;background:#c9cdd8;margin:0 auto 12px}
  .shead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .shead h2{flex:1;margin:0}
  .xbtn{width:52px;height:52px;border-radius:26px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .ln{display:flex;justify-content:space-between;gap:10px;min-height:40px;align-items:center;font-size:18px}
  .ln span:first-child{color:var(--muted)}
  .toasts{position:fixed;top:14px;inset-inline:14px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{max-width:520px;width:100%;display:flex;gap:10px;align-items:center;border-radius:18px;padding:14px 16px;font-weight:500;font-size:18px;background:var(--ok);color:#fff;box-shadow:0 10px 28px -10px rgba(0,0,0,.4);animation:up .2s ease-out}
  .toast.err{background:var(--err)}
  :focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.sheet,.toast{animation:none}}
  /* live tracking */
  .live{position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--line);background:#e9ecf2;margin:0 0 14px}
  #liveMap{height:300px}
  .live .eta{position:absolute;top:10px;inset-inline:10px;z-index:500;display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.18);font-size:18px;font-weight:700}
  .live .eta small{display:block;font-size:14px;font-weight:500;color:var(--muted)}
  .live .eta .big{font-size:30px;line-height:1;color:var(--brand-ink)}
  .pro-pin{display:block;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--brand);border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .2s}
  .home-pin{display:block;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#1d1f2b;border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div class="app">
  <!-- login -->
  <section id="login" hidden>
    <main style="padding-top:48px">
      <div style="display:flex;align-items:center;gap:12px;font-size:34px;font-weight:800;color:var(--brand)"><span class="lgm big"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#fff" d="M32 4C19.8 4 10 13.6 10 25.6 10 41.2 32 60 32 60s22-18.8 22-34.4C54 13.6 44.2 4 32 4z"/><path fill="currentColor" d="M35 12 22 30h9l-3 16 14-20h-9z"/></svg></span>זריז</div>
      <h1 style="margin-top:22px">כניסה</h1>
      <p class="muted" style="margin:-8px 0 8px">שם וטלפון. נשלח לכם קוד בהודעת SMS.</p>
      <form id="loginForm" novalidate>
        <label class="lb" for="lName">השם שלכם</label><input class="field" id="lName" name="name" autocomplete="name">
        <label class="lb" for="lPhone">מספר טלפון נייד</label><input class="field" id="lPhone" name="phone" inputmode="tel" autocomplete="tel" style="direction:ltr;text-align:right">
        <div id="codeRow" hidden><label class="lb" for="lCode">הקוד שקיבלתם ב-SMS</label><input class="field" id="lCode" name="code" inputmode="numeric" autocomplete="one-time-code" style="direction:ltr;text-align:right;letter-spacing:4px"></div>
        <div class="err" id="loginErr" role="alert"></div>
        <button class="btn" id="loginBtn" style="margin-top:22px">שלחו לי קוד</button>
      </form>
      <p style="text-align:center;margin-top:32px"><a href="/pro" style="color:#0f766e;font-weight:500">יש לכם מקצוע? הצטרפו כמקצוענים</a></p>
    </main>
  </section>

  <!-- signed in -->
  <div id="shell" hidden>
    <header class="top">
      <button class="back" id="backBtn" hidden></button>
      <span class="brand" id="topBrand"><span class="lgm"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#fff" d="M32 4C19.8 4 10 13.6 10 25.6 10 41.2 32 60 32 60s22-18.8 22-34.4C54 13.6 44.2 4 32 4z"/><path fill="currentColor" d="M35 12 22 30h9l-3 16 14-20h-9z"/></svg></span>זריז</span>
      <span class="title" id="topTitle" hidden></span>
    </header>

    <!-- home -->
    <main data-view="home">
      <div class="muted" id="hello" style="font-size:19px"></div>
      <div id="homeJobs"></div>
      <button type="button" class="qban" id="queueBan"><svg viewBox="0 0 120 64" width="120" height="64" aria-hidden="true"><g fill="#d9dcE6"><circle cx="100" cy="18" r="9"/><path d="M86 56c0-12 6-20 14-20s14 8 14 20z"/><circle cx="70" cy="18" r="9"/><path d="M56 56c0-12 6-20 14-20s14 8 14 20z"/></g><g fill="#ff6a00"><circle cx="38" cy="14" r="11"/><path d="M20 58c0-15 8-25 18-25s18 10 18 25z"/></g><path d="M31 15l5 5 9-10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span><b>לא בא לכם לעמוד בתור?</b><small>מישהו יעמוד במקומכם. בנק, משרד ממשלתי, קופת חולים</small></span></button>
      <h1>במה אפשר לעזור?</h1>
      <div class="choices" id="groups"></div>
      <h2 style="font-size:19px;font-weight:500;color:var(--muted);margin:24px 0 10px">לא מצאתם? חפשו</h2>
      <label class="search"><span data-i="search" data-s="24"></span><input id="homeSearch" placeholder="למשל: אינסטלטור, שליח, עורך דין" autocomplete="off" aria-label="חיפוש"></label>
    </main>

    <!-- new request: one question per screen -->
    <main data-view="flow" hidden><div id="flow"></div></main>

    <!-- my requests -->
    <main data-view="mine" hidden><div id="mine"></div></main>

    <!-- one request -->
    <main data-view="job" hidden><div id="job"></div></main>

    <!-- account -->
    <main data-view="account" hidden>
      <div class="card" id="acct"></div>
      <p class="muted">הטלפון שלכם נחשף למקצוען רק אם אישרתם שמותר להתקשר, או אחרי שבחרתם בו.</p>
      <button class="btn soft" id="toBoard" style="margin-top:12px"><span data-i="list"></span>איך נראות קריאות של אחרים</button>
      <button class="btn soft" id="logout" style="margin-top:12px"><span data-i="logout"></span>יציאה מהחשבון</button>
      <button class="btn soft" id="deleteAcct" style="margin-top:12px;color:var(--err)"><span data-i="alert"></span>מחיקת החשבון</button>
      <p class="muted" style="text-align:center;margin-top:18px"><a href="/privacy">מדיניות פרטיות</a> · <a href="/terms">תנאי שימוש</a></p>
      <p style="text-align:center;margin-top:30px"><a href="/pro" style="color:#0f766e;font-weight:500">יש לכם מקצוע? הצטרפו כמקצוענים</a></p>
    </main>

    <!-- public board -->
    <main data-view="board" hidden>
      <p class="muted" style="margin-top:0">קריאות פתוחות של אחרים, בלי פרטים אישיים.</p>
      <div id="board"></div>
    </main>

async function api(path, body, method) {

  if (r.status === 401 && token) { token = null; store.set('clientToken', null); showLogin(); }
  if (!r.ok) throw Object.assign(new Error(ERR[data.error] || data.message || data.error || 'משהו השתבש. נסו שוב'), { status: r.status });
  return data;
}

async function shrink(file) {
  if (!file.type.startsWith('image/') || file.type === 'image/gif') return file;

    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
    return blob && blob.size < file.size ? blob : file;
  } catch { return file; } // e.g. HEIC the browser can't decode: upload as is
}

function proName(j) { return j.offers.find((o) => o.status === 'accepted')?.pro?.name ?? 'המקצוען'; }
function statusOf(j) {

    case 'assigned': return [j.offers.find((o) => o.status === 'accepted')?.instant ? `${p} אישר וקיבל את העבודה` : `בחרתם ב${p}. מחכים שיתחיל`, ''];
    case 'en_route': return [del ? `${p} בדרך לאיסוף` : `${p} בדרך אליכם`, ''];

      + (done.length ? `<h2>הסתיימו</h2>${done.map(reqCard).join('')}` : '')
    : `<div class="empty">${ic('list', 48)}<b>עוד לא פתחתם קריאה</b>כשתפתחו, היא תופיע כאן.<button type="button" class="btn" style="margin-top:18px" id="mineNew">לפתוח קריאה</button></div>`;
  $('#mineNew')?.addEventListener('click', () => go('home'));
}

// ---- one request: status, offers, actions
function timeline(j) {
  // Each status is a step: steps before it are done, the matching one is where things stand now.
  const del = j.mode === 'delivery', remote = j.mode === 'remote' || j.mode === 'phone';
  const labels = del ? ['הקריאה נשלחה', 'נבחר שליח', 'בדרך לאיסוף', 'אסף, בדרך אליכם', 'הגיע', 'נמסר']
    : remote ? ['הקריאה נשלחה', 'נבחר מקצוען', 'בטיפול', 'הסתיים']
    : ['הקריאה נשלחה', 'נבחר מקצוען', 'בדרך אליכם', 'הגיע', 'בטיפול', 'הסתיים'];
  const pos = del ? { open: 1, assigned: 2, en_route: 2, picked_up: 3, arrived: 4, completed: 5, closed_done: 6 }
    : remote ? { open: 1, assigned: 2, in_progress: 2, completed: 3, closed_done: 4 }
    : { open: 1, assigned: 2, en_route: 2, arrived: 3, in_progress: 4, completed: 5, closed_done: 6 };
  const at = pos[j.status] ?? 0;
  const now = ['en_route', 'picked_up', 'arrived', 'in_progress'].includes(j.status); // happening right now
  return `<ol class="timeline">${labels.map((l, i) => `<li class="${i < at ? 'done' : i === at ? `cur${now ? ' now' : ''}` : ''}"><span class="dot">${i < at ? ic('check', 16) : ''}</span>${l}</li>`).join('')}</ol>`;
}

// ---- live map: the pro moves on it while he is on the way (kept alive between redraws)
const trackNeeds = () => { const j = jobs.find((x) => x.id === openJobId); return !!j && trackOn(j) !== !!$('#liveSlot'); }; // map card appears/disappears
let trackEl = null, trackMap = null, proMk = null, homeMk = null, trackLine = null, trackFor = null;
const trackOn = (j) => !!j.tracking && ['en_route', 'picked_up', 'arrived'].includes(j.status);
function liveHtml(j) { return trackOn(j) ? '<div class="live" id="liveSlot"></div>' : ''; }
function mountLive(j) {
  const slot = $('#liveSlot');
  if (!slot) return;
  if (!trackEl) { trackEl = document.createElement('div'); trackEl.innerHTML = '<div class="eta" id="liveEta"></div><div id="liveMap"></div>'; }
  slot.appendChild(trackEl);
  updateTrack(j);
}
function updateTrack(j) {
  const t = j?.tracking;
  if (!t || !trackEl || !trackEl.isConnected) return;
  const del = j.mode === 'delivery', name = proName(j);
  const km = t.km != null ? (t.km < 1 ? `${Math.round(t.km * 1000)} מטר` : `${t.km} ק״מ`) : '';
  $('#liveEta').innerHTML = j.status === 'arrived' ? `${ic('check', 26)}<span>${esc(name)} הגיע<small>צאו לפגוש אותו</small></span>`
    : t.etaMin != null ? `<span class="big">${t.etaMin}</span><span>דקות<small>${esc(name)} ${j.status === 'picked_up' ? 'בדרך אליכם עם המשלוח' : del ? 'בדרך לאיסוף' : 'בדרך אליכם'}${km ? ` · ${km}` : ''}</small></span>` : `<span>${esc(name)} בדרך</span>`;
  if (!window.L) return;
  const me = [t.lat, t.lng], dest = t.toward ? [t.toward.lat, t.toward.lng] : null;
  if (!trackMap) {
    trackMap = L.map('liveMap', { zoomControl: false, attributionControl: true });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(trackMap);
    trackMap.attributionControl.setPrefix(false);
  }
  trackMap.invalidateSize();
  if (!proMk) proMk = L.marker(me, { interactive: false, keyboard: false, icon: L.divIcon({ className: '', html: `<span class="pro-pin">${ic('person', 24)}</span>`, iconSize: [0, 0] }) }).addTo(trackMap);
  else proMk.setLatLng(me);
  if (dest) {
    if (!homeMk) homeMk = L.marker(dest, { interactive: false, keyboard: false, icon: L.divIcon({ className: '', html: '<span class="home-pin"></span>', iconSize: [0, 0] }) }).addTo(trackMap);
    else homeMk.setLatLng(dest);
    if (!trackLine) trackLine = L.polyline([me, dest], { color: '#ff6a00', weight: 4, dashArray: '8 8', opacity: .8 }).addTo(trackMap);
    else trackLine.setLatLngs([me, dest]);
    if (trackFor !== j.id + j.status) { trackFor = j.id + j.status; trackMap.fitBounds([me, dest], { paddingTopLeft: [40, 90], paddingBottomRight: [40, 30], maxZoom: 17 }); }
    else if (!trackMap.getBounds().contains(me)) trackMap.fitBounds([me, dest], { paddingTopLeft: [40, 90], paddingBottomRight: [40, 30], maxZoom: 17 });
  } else if (trackFor !== j.id) { trackFor = j.id; trackMap.setView(me, 15); }
}
function offerHtml(j, o) {
  const p = o.pro;
  const open = j.status === 'open';
  const noPrice = j.paymentMode === 'in_app' && o.price == null && !o.items;
  const items = (o.items ?? []).map((i) => `<div class="item">${ic({ hotel: 'hotel', flight: 'flight', activity: 'ticket' }[i.kind] ?? 'box', 20)}<span><b>${esc(i.title)}</b> · ${ils(i.price)}
    <span class="muted" style="display:block">${esc(i.details)}${i.freeCancellationBefore ? ` · ביטול חינם עד ${esc(i.freeCancellationBefore.slice(0, 10))}` : ''}</span></span></div>`).join('');
  return `<div class="offer ${o.status === 'accepted' ? 'won' : ''}">
    <div class="who"><span class="av">${ic('person', 28)}</span><span style="flex:1;min-width:0"><b style="font-size:20px">${esc(p.name)}</b>
      <span class="muted" style="display:flex;gap:4px;align-items:center">${p.ratingCount ? `${ic('star', 16)} ${p.ratingAvg} · ${p.ratingCount} דירוגים` : 'מקצוען חדש'}</span></span>
      ${o.price != null ? `<span class="price">${ils(o.price)}</span>` : '<span class="muted" style="text-align:left">מחיר<br>אחרי בדיקה</span>'}</div>
    ${o.eta ? `<div class="line">${ic('clock', 20)}<span>מתי: ${esc(o.eta)}</span></div>` : ''}
    ${o.message ? `<div class="line" style="align-items:flex-start">${ic('text', 20)}<span>${esc(o.message)}</span></div>` : ''}${items}
    ${o.status === 'accepted' ? `<div class="line" style="color:var(--ok);font-weight:700">${ic('check', 22)}${o.instant ? 'אישר את המחיר שלכם' : 'בחרתם בו'}</div>${p.phone ? `<a class="btn soft" style="margin-top:12px" href="tel:${esc(tel(p.phone))}">${ic('phone')}להתקשר ל${esc(p.name)}</a>` : ''}`
      : open ? (noPrice ? '<p class="muted" style="margin:10px 0 0">בתשלום מאובטח אפשר לבחור רק הצעה עם מחיר.</p>'
        : `<button type="button" class="btn" style="margin-top:14px" data-accept="${j.id}|${o.id}">${o.items ? 'להזמין ולשלם' : `לבחור ב${esc(p.name)}`}</button>
           ${p.phone ? `<a class="btn soft" style="margin-top:10px" href="tel:${esc(tel(p.phone))}">${ic('phone')}להתקשר קודם</a>` : ''}`) : ''}
  </div>`;
}
function renderJob() {
  const j = jobs.find((x) => x.id === openJobId);
  if (!j) { $('#job').innerHTML = `<div class="empty">${ic('clock', 48)}<b>טוען…</b></div>`; return; }
  const [s, cls] = statusOf(j);
  const accepted = j.offers.find((o) => o.status === 'accepted');
  const others = j.status === 'open' ? j.offers : [];
  $('#job').innerHTML = `
    <div class="bigstatus status ${cls}" style="font-size:24px"><i style="width:14px;height:14px;border-radius:7px"></i>${esc(s)}</div>
    ${liveHtml(j)}
    ${j.status === 'open' && !j.offers.length ? `<div class="card" style="text-align:center"><div class="done-ic">${ic('check', 44)}</div><b style="font-size:21px">הקריאה נשלחה</b><p class="muted" style="margin:6px 0 0">${j.clientPrice != null ? `קבעתם ${ils(j.clientPrice)}. המקצוען הראשון באזור שמאשר מקבל את העבודה, ותראו אותו כאן.` : 'מקצוענים באזור קיבלו אותה. כשתגיע הצעה, היא תופיע כאן.'}</p></div>` : ''}
    ${j.status === 'open' && j.offers.length && j.clientPrice != null ? `<div class="item" style="margin-bottom:12px">${ic('info')}<span>קבעתם ${ils(j.clientPrice)}. עד שמישהו מאשר, אפשר גם לבחור הצעה במחיר אחר.</span></div>` : ''}
    ${j.status === 'completed' ? `<button type="button" class="btn ok" data-confirm="${j.id}" style="margin-bottom:14px">${ic('check')}הכל תקין, סיימנו${j.escrow ? ' (התשלום ישוחרר)' : ''}</button>` : ''}
    ${j.status === 'closed_done' && !j.rated ? `<div class="card" style="text-align:center"><b style="font-size:21px">איך היה?</b><div class="stars" role="group" aria-label="דירוג">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-rate="${j.id}|${n}" aria-label="${n} כוכבים">${ic('star', 38)}</button>`).join('')}</div></div>` : ''}
    ${j.status === 'booking_failed' ? `<div class="item" style="background:var(--err-soft);color:var(--err)">${ic('alert')}<span>הספק לא אישר את ההזמנה. הכסף הוחזר.</span></div>` : ''}
    ${j.booking?.status === 'confirmed' ? `<div class="item" style="background:var(--ok-soft);color:var(--ok)">${ic('check')}<span>ההזמנה אושרה: ${j.booking.items.map((b) => `${esc(b.title)} (אסמכתא ${esc(b.supplierRef)})`).join(', ')}</span></div>` : ''}
    ${others.length ? `<h2>ההצעות שקיבלתם</h2>${others.map((o) => offerHtml(j, o)).join('')}` : ''}
    ${accepted ? `<h2>${accepted.instant ? 'המקצוען שלכם' : 'המקצוען שבחרתם'}</h2>${offerHtml(j, accepted)}` : ''}
    ${j.status !== 'booking_failed' ? `<h2>איפה זה עומד</h2><div class="card">${timeline(j)}</div>` : ''}
    ${j.workLog.length ? `<h2>מה נעשה</h2><div class="card">${j.workLog.map((l) => `<div class="sum">${ic('check')}<div>${esc(l.text)}${l.photos?.length ? ` <span>צורפו ${l.photos.length} תמונות</span>` : ''}</div></div>`).join('')}</div>` : ''}
    <h2>מה ביקשתם</h2>
    <div class="card"><b style="font-size:20px">${esc(cats[j.categoryId]?.name ?? '')}</b><p style="margin:6px 0 0">${esc(j.description)}</p>${mediaHtml(j.media)}
      ${j.address ? `<div class="line">${ic('pin', 20)}<span>${j.dropoff ? `איסוף: ${esc(j.address)}<br>מסירה: ${esc(j.dropoff.address)}` : esc(j.address)}</span></div>` : ''}
      <div class="line">${ic('clock', 20)}<span>${j.urgency === 'urgent' ? 'דחוף' : 'לא דחוף'} · ${MODE[j.mode]}${j.paymentMode === 'in_app' ? ' · תשלום מאובטח' : ''}</span></div></div>`;
  mountLive(j);
}

async function load() {
  if (!token) return;
  try {
    jobs = await api('/api/client/jobs');
    jobs.sort((a, b) => b.createdAt - a.createdAt);
  } catch { return; } // 401 handled in api()
  const n = jobs.filter(needsMe).length;
  $('#mineBadge').hidden = !n; $('#mineBadge').textContent = n;
  const json = JSON.stringify(jobs.map(({ tracking, ...j }) => j)); // the moving dot must not redraw the page
  if (view === 'job') updateTrack(jobs.find((x) => x.id === openJobId));
  if (json === lastJobsJson && !(view === 'job' && trackNeeds())) return; // nothing changed: don't redraw
  lastJobsJson = json;
  renderHome();
  if ($('.scrim')) return; // don't redraw under an open sheet
  if (view === 'mine') renderMine();
  if (view === 'job') renderJob();
}
async function renderBoard() {
  const board = await api('/api/jobs').catch(() => []);
  $('#board').innerHTML = board.length ? board.map((j) => `<div class="card"><b style="font-size:19px">${esc(cats[j.categoryId]?.name ?? '')}</b><p style="margin:4px 0">${esc(j.description)}</p>
    <span class="muted">${MODE[j.mode]}${j.urgency === 'urgent' ? ' · דחוף' : ''} · נשארו ${j.offersLeft} מקומות להצעות</span></div>`).join('')
    : `<div class="empty">${ic('list', 48)}<b>אין קריאות פתוחות כרגע</b></div>`;
}

// ---- actions: choose an offer (confirmation sheet; travel adds the traveler form), confirm, rate
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button[data-accept],button[data-confirm],button[data-rate]');
  if (!t) return;
  try {
    if (t.dataset.rate) {
      const [job, score] = t.dataset.rate.split('|');
      await api(`/api/jobs/${job}/rate`, { score: +score }); toast('תודה על הדירוג');
    } else if (t.dataset.confirm) {
      t.disabled = true;
      await api(`/api/jobs/${t.dataset.confirm}/confirm`, {}); toast('תודה. העבודה אושרה');
    } else return confirmOffer(...t.dataset.accept.split('|'));
  } catch (err) { t.disabled = false; toast(err.message, 'err'); }
  lastJobsJson = ''; load();
});
function confirmOffer(jobId, offerId) {
  const j = jobs.find((x) => x.id === jobId); const o = j?.offers.find((x) => x.id === offerId);
  if (!o) return;
  const secure = j.paymentMode === 'in_app' || !!o.items;
  const total = o.items ? o.items.reduce((s, i) => s + +i.price, 0) : o.price;
  const flight = o.items?.some((i) => i.kind === 'flight');
  const s = sheet(`<div class="shead"><h2>לבחור ב${esc(o.pro.name)}?</h2><button type="button" class="xbtn" data-close aria-label="סגירה">${ic('x')}</button></div>
    <div class="card">
      ${o.items ? o.items.map((i) => `<div class="ln"><span>${esc(i.title)}</span><b>${ils(i.price)}</b></div>`).join('') : `<div class="ln"><span>המחיר</span><b>${total != null ? ils(total) : 'אחרי בדיקה'}</b></div>`}
      ${j.itemsCost ? `<div class="ln"><span>הקנייה עבורכם, לפי קבלה</span><b>עד ${ils(j.itemsCost)}</b></div>` : ''}
    </div>
    <div class="item" style="${secure ? 'background:var(--ok-soft);color:#0b5e39;' : ''}padding:14px;font-size:17px">${ic(secure ? 'lock' : 'info')}<span>${secure ? 'תשלום מאובטח: הכסף משתחרר רק אחרי שתאשרו שהעבודה הסתיימה.' : 'משלמים למקצוען ישירות, בסיום העבודה.'}</span></div>
    ${o.items ? `<b style="display:block;margin-top:16px">פרטי הנוסע, כמו בדרכון</b>
      <div style="display:flex;gap:8px;margin-top:8px"><input class="field" data-t="firstName" placeholder="First name" style="direction:ltr" aria-label="שם פרטי באנגלית"><input class="field" data-t="lastName" placeholder="Last name" style="direction:ltr" aria-label="שם משפחה באנגלית"></div>
      <input class="field" data-t="email" type="email" placeholder="Email" style="direction:ltr;margin-top:8px" aria-label="אימייל לשובר">
      ${flight ? `<div style="display:flex;gap:8px;margin-top:8px"><input class="field" data-t="bornOn" type="date" aria-label="תאריך לידה"><select class="field" data-t="gender" aria-label="מין"><option value="f">נקבה</option><option value="m">זכר</option></select></div>` : ''}
      <div class="err" id="travErr"></div>` : ''}
    <p class="muted" style="margin:14px 2px">אחרי הבחירה רק ${esc(o.pro.name)} יקבל את הכתובת והטלפון שלכם.</p>
    <button type="button" class="btn" id="doAccept">${o.items ? 'להזמין ולשלם' : 'כן, לבחור בו'}</button>
    <button type="button" class="btn soft" data-close style="margin-top:10px">לא עכשיו</button>`);
  $('#doAccept', s.el).onclick = async () => {
    const traveler = Object.fromEntries($$('[data-t]', s.el).map((i) => [i.dataset.t, i.value.trim()]));
    if (o.items && !(traveler.firstName && traveler.lastName && traveler.email)) return ($('#travErr', s.el).textContent = 'נא למלא שם ואימייל של הנוסע');
    $('#doAccept', s.el).disabled = true;
    try {
      const res = await api(`/api/jobs/${jobId}/offers/${offerId}/accept`, { traveler });
      s.close();
      if (res.booking?.status === 'failed') toast('הספק לא אישר את ההזמנה. הכסף הוחזר.', 'err'); else toast(`בחרתם ב${o.pro.name}`);
    } catch (err) { $('#doAccept', s.el).disabled = false; toast(err.message, 'err'); }
    lastJobsJson = ''; load();
  };
}

api('/api/config').then((c) => { cfg = c; }).catch(() => {});
let build = null;
async function checkBuild() {
  try {
    const v = await fetch('/api/version', { cache: 'no-store' }).then((r) => r.json());
    const busy = view === 'flow' || $('.scrim') || $('.lightbox') || document.activeElement?.matches?.('input,textarea');
    if (build && v.build !== build && !busy) location.reload();
    build = build ?? v.build;
  } catch {}
}
checkBuild(); setInterval(checkBuild, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); checkBuild(); } });
api('/api/categories').then((t) => {
  tree = t;
  for (const p of tree) for (const s of p.subs) cats[s.id] = { ...s, parent: p.id, modes: s.modes ?? p.modes, payment: p.payment, parentName: p.name };
  showLogin(); load();
}).catch(() => { showLogin(); toast('אין חיבור לשרת', 'err'); });
setInterval(load, 5000);
setInterval(() => { if (view === 'job' && jobs.some((j) => j.id === openJobId && trackOn(j))) load(); }, 3000); // live map: refresh every 3 seconds
</script>
</body>
