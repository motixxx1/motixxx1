<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>זריז · ניהול</title>
<style>
  :root{color-scheme:light;--brand:#ff6a00;--ink:#14161f;--muted:#5b6275;--line:#e3e6ec;--ok:#059669;--bad:#c62828}
  *{box-sizing:border-box}
  body{margin:0;background:#f6f7f9;color:var(--ink);font-family:"Rubik","Assistant",system-ui,sans-serif;font-size:16px}
  header{background:var(--ink);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
  header b{font-size:20px}
  header button{margin-inline-start:auto}
  main{max-width:820px;margin:0 auto;padding:18px 16px 60px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
  label{display:block;font-weight:600;margin:10px 0 6px}
  input{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff}
  input:focus{outline:none;border-color:var(--brand)}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 18px;background:var(--brand);color:#fff;cursor:pointer}
  button.ghost{background:transparent;color:inherit;border:2px solid currentColor;padding:7px 14px}
  button:disabled{opacity:.5}
  .muted{color:var(--muted);font-size:14px}
  .err{color:var(--bad);font-weight:600;min-height:1.4em;margin-top:8px}
  .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .bal{font-weight:800;font-size:18px;white-space:nowrap}
  .add{display:flex;gap:8px;margin-top:8px;grid-column:1/-1}
  .add input{width:120px;padding:8px 10px}
  .add button{padding:8px 14px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;display:none}
</style>
</head>
<body>
<header><b>זריז · ניהול</b><button class="ghost" id="out" hidden>יציאה</button></header>
<main>
  <section class="card" id="login">
    <h2 style="margin:0 0 4px">כניסת מנהל</h2>
    <p class="muted">רק מספרים שמופיעים ב-ADMIN_PHONES בקובץ config.env בשרת.</p>
    <label for="phone">טלפון</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="050-0000000">
    <div id="codeBox" hidden><label for="code">הקוד שקיבלת ב-SMS</label><input id="code" inputmode="numeric" autocomplete="one-time-code"></div>
    <button id="go" style="margin-top:14px">שליחת קוד</button>
    <div class="err" id="lerr"></div>
  </section>

  <section id="app" hidden>
    <div class="card">
      <h2 style="margin:0 0 4px">קרדיט למקצוענים</h2>
      <p class="muted">טעינה ידנית, למשל אחרי העברה בנקאית או ביט. אפשר גם להוריד קרדיט עם מספר שלילי. כל פעולה נרשמת בהיסטוריה של המקצוען.</p>
      <input id="q" placeholder="חיפוש לפי שם או טלפון" style="margin-top:8px">
    </div>
    <div class="card" id="list"></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
let token = sessionStorage.getItem('adminToken');
let pros = [];
const toast = (t) => { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (e.style.display = 'none'), 2600); };
async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); throw new Error('צריך להתחבר מחדש'); }
  if (!r.ok) throw new Error(MSG[data.error] || data.message || 'שגיאה');
  return data;
}
const MSG = { forbidden: 'המספר הזה אינו מנהל', bad_code: 'הקוד שגוי', code_expired: 'הקוד פג, שלחו שוב', bad_phone: 'מספר טלפון לא תקין',
  bad_amount: 'סכום לא תקין', too_soon: 'חכו רגע לפני שליחה נוספת' };
const ils = (n) => `${Number(n).toLocaleString('he-IL')} ₪`;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const local = (p) => String(p).replace(/^972/, '0');

$('#go').onclick = async () => {
  $('#lerr').textContent = ''; $('#go').disabled = true;
  try {
    if ($('#codeBox').hidden) {
      await api('/api/auth/request', { phone: $('#phone').value });
      $('#codeBox').hidden = false; $('#go').textContent = 'כניסה'; $('#code').focus();
    } else {
      const r = await api('/api/auth/verify', { phone: $('#phone').value, code: $('#code').value, role: 'admin' });
      token = r.token; sessionStorage.setItem('adminToken', token); start();
    }
  } catch (e) { $('#lerr').textContent = e.message; } finally { $('#go').disabled = false; }
};
function logout() { token = null; sessionStorage.removeItem('adminToken'); $('#app').hidden = true; $('#login').hidden = false; $('#out').hidden = true; }
$('#out').onclick = logout;

async function start() {
  $('#login').hidden = true; $('#app').hidden = false; $('#out').hidden = false;
  try { pros = await api('/api/admin/pros'); draw(); } catch (e) { toast(e.message); }
}
function draw() {
  const q = $('#q').value.trim().replace(/-/g, '');
  const list = pros.filter((p) => !q || (p.name || '').includes(q) || local(p.phone).includes(q) || p.phone.includes(q));
  $('#list').innerHTML = list.length ? list.map((p) => `
    <div class="row" data-id="${esc(p.id)}">
      <div><b>${esc(p.name || 'ללא שם')}</b><div class="muted">${esc(local(p.phone))}</div></div>
      <div class="bal">${ils(p.balance)}</div>
      <div class="add"><input type="number" step="1" placeholder="סכום" aria-label="סכום"><button>עדכון קרדיט</button></div>
    </div>`).join('') : '<p class="muted">אין מקצוענים להצגה</p>';
}
$('#q').oninput = draw;
$('#list').onclick = async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const row = b.closest('.row'), amount = Number(row.querySelector('input').value);
  const p = pros.find((x) => x.id === row.dataset.id);
  if (!amount) return toast('כתבו סכום');
  if (!confirm(`${amount > 0 ? 'להוסיף' : 'להוריד'} ${ils(Math.abs(amount))} ${amount > 0 ? 'ל' : 'מ'}${p.name || local(p.phone)}?`)) return;
  b.disabled = true;
  try { const r = await api(`/api/admin/pros/${encodeURIComponent(p.id)}/credit`, { amount }); p.balance = r.balance; draw(); toast('הקרדיט עודכן'); }
  catch (err) { toast(err.message); b.disabled = false; }
};
if (token) start();
</script>
</body>
</html>
