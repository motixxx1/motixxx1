name: Phone apps – run on an emulator

# Both apps run on an Android emulator against a demo server; every screen is
# photographed and published to the "ci-shots" release.
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile-e2e.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Demo server
        run: |
          cd backend
          DEMO_MODE=1 PORT=3000 DATA_FILE=/tmp/zz/state.json nohup node src/server.js > ../server.txt 2>&1 &
          sleep 2; curl -s localhost:3000/api/config
      - name: Packages
        working-directory: mobile
        run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: ./tool/e2e.sh
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p shots
          cp e2e-*.txt logcat.txt server.txt shots/ 2>/dev/null || true
          for f in shots/*.txt; do grep -vE '^\s*$' "$f" | tail -400 > "$f.tmp" && mv "$f.tmp" "$f"; done
          gh release view ci-shots >/dev/null 2>&1 || gh release create ci-shots --prerelease --title "CI screenshots" --notes "Screens from the emulator run"
          for a in $(gh release view ci-shots --json assets -q '.assets[].name'); do gh release delete-asset ci-shots "$a" --yes; done
          gh release upload ci-shots shots/* --clobber
          ls shots
