function Chart({ data }) {
  const max = Math.max(...data.map((p) => p.v), 100) * 1.15, w = 300, h = 120, pad = 22;
  const x = (i) => pad + (i * (w - pad * 2)) / (data.length - 1);
  const y = (v) => h - pad - (v / max) * (h - pad * 2);
  const line = data.map((p, i) => `${i ? "L" : "M"}${x(i)},${y(p.v)}`).join(" ");
  const area = `${line} L${x(data.length - 1)},${h - pad} L${x(0)},${h - pad} Z`;
  const best = data.reduce((a, b) => (b.v > a.v ? b : a));
  const bi = data.indexOf(best);
  return (
    <svg viewBox={`0 0 ${w} ${h + 14}`} className="w-full" role="img" aria-label="רווחים">
      <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor="var(--accent)" stopOpacity=".45" /><stop offset="1" stopColor="var(--accent)" stopOpacity="0" /></linearGradient></defs>

      <path d={line} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinejoin="round" />
      <circle cx={x(bi)} cy={y(best.v)} r="5" fill="var(--accent)" />

    </svg>
  );
}

  const allDeals = [...listings, ...DEALS];
  const shownJobs = useMemo(() => JOBS.filter((j) =>
    (jobCat === "הכל" || (jobCat === "שירותים" ? ["אינסטלציה", "חשמל", "מחשבים"].includes(j.cat) : j.cat === jobCat)) &&
    (jobMode === "all" || j.mode === jobMode) && (!urgentOnly || j.urgent) && (!jobQ || (j.title + j.cat + j.area).includes(jobQ))
  ), [jobCat, jobMode, urgentOnly, jobQ]);
  const shownDeals = useMemo(() => {
    let r = allDeals.filter((d) => (dealCat === "הכל" || d.cat === dealCat) && (!dealQ || (d.name + d.cat).toLowerCase().includes(dealQ.toLowerCase())));
    if (dealSort === "low") r = [...r].sort((a, b) => a.price - b.price);
    if (dealSort === "disc") r = [...r].sort((a, b) => b.was - b.price - (a.was - a.price));
    return r;
  }, [dealCat, dealQ, dealSort, listings]);

  const top = stack[stack.length - 1];
  const tabs = [{ id: "jobs", label: "קריאות", icon: "Radio" }, { id: "deals", label: "מציאות", icon: "ShoppingBag" }, { id: "wallet", label: "ארנק", icon: "Wallet" }, { id: "profile", label: "פרופיל", icon: "User" }];
  const push = (t, id) => setStack((s) => [...s, { t, id }]);
  const back = () => setStack((s) => s.slice(0, -1));
  const title = top ? (top.t === "orders" ? "ההזמנות שלי" : top.t === "job" ? "פרטי קריאה" : "פרטי מוצר") : ({ jobs: "קריאות חיות", deals: "מציאות יד שנייה", wallet: "הארנק שלי", profile: "הפרופיל שלי" })[tab];

  // ============ screens ============
  const JobDetail = ({ id }) => {
    const j = JOBS.find((x) => x.id === id); const st = jobState[id];
    const [price, setPrice] = useState(String(Math.round(j.fee * (j.kind === "quote" ? 1 : 1))));
    const [msg, setMsg] = useState("");
    const [note, setNote] = useState("");
    const blocked = j.needs === "license" && profile.docs.license !== "ok";
    const flow = FLOW[j.mode];
    return (
      <div className="flex flex-col gap-3">
        <section className="rounded-3xl p-4" style={{ background: "var(--surface-2)" }}>
          <div className="flex items-start gap-3">
            <div className="grid h-12 w-12 shrink-0 place-items-center rounded-2xl" style={{ background: "var(--surface)", color: "var(--accent-2)" }}><Icon name={j.icon} /></div>
            <div className="min-w-0"><div className="flex flex-wrap items-center gap-2 text-xs" style={{ color: "var(--muted)" }}><span>{j.cat}</span>{j.urgent && <span className="font-bold" style={{ color: "var(--hot)" }}>· דחוף</span>}<span>· {j.ago}</span></div>
              <h2 className="display text-lg font-bold leading-snug">{j.title}</h2></div>
          </div>
          <div className="mt-3 flex flex-wrap gap-2"><span className={"rounded-full px-3 py-1 text-sm font-bold num " + (j.urgent ? "glow-hot" : "glow")}>{j.kind === "lead" ? "עמלה" : "דמי עבודה"}: {ils(j.fee)}</span>
            <span className="rounded-full px-3 py-1 text-sm" style={{ background: "var(--surface)" }}>{MODE[j.mode]}</span></div>
        </section>
        <section className="flex flex-col gap-2 rounded-3xl p-4" style={{ background: "var(--surface-2)" }}>
          <Row icon="MapPin" label="אזור" value={j.area} /><Row icon="Navigation" label="מרחק ממך" value={j.km != null ? `${j.km} ק״מ` : "לא רלוונטי"} />
          <Row icon="CreditCard" label="תשלום" value={j.pay} />
          {j.pickup && <Row icon="Store" label="איסוף" value={j.pickup} />}{j.dropoff && <Row icon="Flag" label="מסירה" value={j.dropoff} />}
          {j.itemsCost && <Row icon="ShoppingCart" label="קנייה עבור הלקוח" value={`${ils(j.itemsCost)} (מוחזר)`} color="var(--accent)" />}
          {j.photos && <Row icon="Image" label="תמונות מהלקוח" value={`${j.photos}`} />}
        </section>
        <section className="rounded-3xl p-4" style={{ background: "var(--surface-2)" }}>
          <h3 className="display mb-1 font-bold">תיאור</h3><p className="text-sm leading-relaxed" style={{ color: "var(--muted)" }}>{j.desc}</p>
        </section>
        <section className="flex items-center gap-3 rounded-3xl p-4" style={{ background: "var(--surface-2)" }}>
          <div className="grid h-11 w-11 place-items-center rounded-full font-extrabold" style={{ background: "var(--surface-3)" }}>{j.client.name[0]}</div>
          <div><div className="font-bold">{j.client.name}</div><div className="flex items-center gap-2 text-xs" style={{ color: "var(--muted)" }}><Stars r={j.client.rating} />{j.client.jobs} קריאות קודמות</div></div>
        </section>

        {blocked && <div className="rounded-2xl p-3 text-sm" style={{ background: "#3b2a10", color: "var(--warn)" }}><b>נדרש רישיון חשמלאי.</b> העלה מסמך בפרופיל וחכה לאישור כדי לקבל קריאות בתחום.
          <button onClick={() => { setStack([]); setTab("profile"); }} className="mt-2 block font-bold underline">לפרופיל</button></div>}

        {!st && !blocked && j.kind === "lead" && (
          <button onClick={() => takeLead(j)} className="flex items-center justify-center gap-2 rounded-2xl py-3.5 font-bold" style={{ background: "var(--accent)", color: "#062521" }}><Icon name="Zap" size={18} />תפוס קריאה · +{ils(j.fee)} מיד</button>)}
        {!st && !blocked && j.kind === "quote" && (
          <section className="rounded-3xl p-4" style={{ background: "var(--surface-2)" }}>
            <h3 className="display font-bold">שלח הצעה ללקוח</h3>
            <Label>המחיר שלך (₪)</Label><input id="offer-price" className="field num" inputMode="numeric" value={price} onChange={(e) => setPrice(e.target.value.replace(/\D/g, ""))} />
            <Label>הודעה ללקוח</Label><textarea id="offer-msg" rows={2} className="field" placeholder="אפשר להגיע תוך שעה…" value={msg} onChange={(e) => setMsg(e.target.value)} />
            <div className="mt-2 text-xs" style={{ color: "var(--muted)" }}>עלות שליחת הצעה: ₪10 מהיתרה · הלקוח רואה עד 5 הצעות</div>
            <button disabled={!price || balance < 10} onClick={() => { pay("עמלת שליחת הצעה", -10); sendOffer(j, +price, msg); }} className="mt-3 flex w-full items-center justify-center gap-2 rounded-2xl py-3 font-bold disabled:opacity-50" style={{ background: "var(--accent)", color: "#062521" }}><Icon name="Send" size={17} />שלח הצעה</button>
          </section>)}
        {st?.state === "offered" && <div className="flex items-center gap-2 rounded-2xl p-4 text-sm font-semibold" style={{ background: "var(--surface-2)" }}><Icon name="Hourglass" size={18} className="live" />ההצעה שלך ({ils(st.offer)}) נשלחה. מחכים שהלקוח יבחר…</div>}
        {st && st.state !== "offered" && (
          <>
            <section className="rounded-3xl p-4" style={{ background: "var(--surface-2)" }}>
              <h3 className="display mb-2 font-bold">{st.state === "done" ? "הושלם ✓" : "ניהול העבודה"}</h3>
              <ol className="flex flex-col gap-2">{flow.map((s, i) => (
                <li key={s} className="flex items-center gap-2 text-sm"><span className="grid h-6 w-6 place-items-center rounded-full text-xs font-bold" style={{ background: i < st.step ? "var(--ok)" : i === st.step ? "var(--accent)" : "var(--surface)", color: i <= st.step ? "#062521" : "var(--muted)" }}>{i < st.step ? <Icon name="Check" size={13} /> : i + 1}</span><span style={{ color: i <= st.step ? "var(--fg)" : "var(--muted)" }}>{s}</span></li>))}</ol>
              <div className="mt-3 flex gap-2">
                <a href={`tel:${j.client.phone}`} onClick={(e) => e.preventDefault()} className="flex flex-1 items-center justify-center gap-1.5 rounded-2xl py-2.5 text-sm font-bold" style={{ background: "var(--surface)" }}><Icon name="Phone" size={15} />{j.client.phone}</a>
                {j.mode !== "remote" && <button onClick={() => toast("פותח ניווט ב-Waze…")} className="flex flex-1 items-center justify-center gap-1.5 rounded-2xl py-2.5 text-sm font-bold" style={{ background: "var(--surface)" }}><Icon name="Navigation" size={15} />Waze</button>}
              </div>
              {st.state === "active" && <button onClick={() => advance(j)} className="mt-3 flex w-full items-center justify-center gap-2 rounded-2xl py-3 font-bold" style={{ background: "var(--accent)", color: "#062521" }}><Icon name="ChevronLeft" size={17} />{flow[st.step]}</button>}
            </section>
            <section className="rounded-3xl p-4" style={{ background: "var(--surface-2)" }}>
              <h3 className="display mb-2 font-bold">תיעוד העבודה</h3>
              <div className="flex gap-2"><input id="log-note" className="field" placeholder="מה עשית / מה צריך…" value={note} onChange={(e) => setNote(e.target.value)} />
                <button onClick={() => { if (note.trim()) { addLog(j, note.trim()); setNote(""); toast("נוסף לתיעוד"); } }} className="rounded-2xl px-4 font-bold" style={{ background: "var(--accent)", color: "#062521" }}>הוסף</button></div>
              <button onClick={() => { addLog(j, "📷 צורפה תמונה"); toast("התמונה נוספה"); }} className="mt-2 flex items-center gap-1.5 text-sm font-bold" style={{ color: "var(--accent)" }}><Icon name="Camera" size={15} />צרף תמונה</button>
              <ul className="mt-2 flex flex-col gap-1.5">{(st.log || []).map((l, i) => <li key={i} className="text-sm" style={{ color: "var(--muted)" }}>• {l.t} <span className="text-xs">({l.at})</span></li>)}</ul>
            </section>
          </>)}
      </div>
    );
  };

  const DealDetail = ({ id }) => {
    const d = allDeals.find((x) => x.id === id);
    const [ship, setShip] = useState(d.pickupOnly ? "pickup" : "courier");
    const [size, setSize] = useState(d.sizes?.[1]);
    const off = Math.round((1 - d.price / d.was) * 100);
    const total = d.price + (ship === "courier" ? 25 : 0);
    const owned = orders.some((o) => o.d.id === d.id);
    return (
      <div className="flex flex-col gap-3">
        <div className="relative grid h-56 place-items-center rounded-3xl" style={{ background: `radial-gradient(circle at 30% 25%, ${d.hue}66, ${d.hue}10 70%)`, color: d.hue }}>
          <Icon name={d.icon} size={84} />
          <span className="absolute right-3 top-3 rounded-full px-3 py-1 text-sm font-bold num" style={{ background: "var(--surface)", color: "var(--warn)" }}>-{off}%</span>
          <button onClick={() => setFavs((f) => ({ ...f, [d.id]: !f[d.id] }))} aria-label="שמור למועדפים" className="absolute left-3 top-3 grid h-9 w-9 place-items-center rounded-full" style={{ background: "var(--surface)", color: favs[d.id] ? "var(--hot)" : "var(--fg)" }}><Icon name="Heart" size={18} style={{ fill: favs[d.id] ? "var(--hot)" : "none" }} /></button>
        </div>
        <div className="flex items-start justify-between gap-3"><div><h2 className="display text-xl font-extrabold">{d.name}</h2><div className="text-sm" style={{ color: "var(--muted)" }}>{d.cat} · {d.cond}</div></div>
          <div className="text-left num"><div className="display text-2xl font-extrabold">{ils(d.price)}</div><div className="text-xs line-through" style={{ color: "var(--muted)" }}>{ils(d.was)}</div></div></div>
        <p className="text-sm leading-relaxed" style={{ color: "var(--muted)" }}>{d.desc}</p>
        {d.sizes && <div><Label>מידה</Label><div className="flex gap-2">{d.sizes.map((s) => <Chip key={s} on={size === s} onClick={() => setSize(s)}>{s}</Chip>)}</div></div>}
        <section className="flex items-center gap-3 rounded-3xl p-3" style={{ background: "var(--surface-2)" }}>
          <div className="grid h-10 w-10 place-items-center rounded-full font-extrabold" style={{ background: "var(--surface-3)" }}>{d.seller[0]}</div>
          <div className="flex-1"><div className="font-bold">{d.seller}</div><div className="flex items-center gap-2 text-xs" style={{ color: "var(--muted)" }}><Stars r={d.rating} /><Icon name="MapPin" size={12} />{d.area}</div></div>
          <button onClick={() => toast("ההודעה נשלחה למוכר")} className="grid h-10 w-10 place-items-center rounded-full" style={{ background: "var(--surface)" }} aria-label="שלח הודעה"><Icon name="MessageCircle" size={18} /></button>
        </section>
        <section className="rounded-3xl p-3" style={{ background: "var(--surface-2)" }}>
          <div className="mb-2 text-sm font-bold">איך מקבלים?</div>
          {[["courier", "Bike", "משלוח עם שליח", "₪25 · עד 3 שעות", d.pickupOnly], ["pickup", "Handshake", "איסוף עצמי מהמוכר", "חינם", false]].map(([k, ic, t, s, dis]) => (
            <button key={k} disabled={dis} onClick={() => setShip(k)} className="mb-1 flex w-full items-center gap-3 rounded-2xl p-2.5 text-right disabled:opacity-40" style={{ background: ship === k ? "color-mix(in srgb, var(--accent) 15%, transparent)" : "var(--surface)", border: ship === k ? "1px solid var(--accent)" : "1px solid transparent" }}>
              <Icon name={ic} size={18} /><span className="flex-1 text-sm font-semibold">{t}<span className="block text-xs font-normal" style={{ color: "var(--muted)" }}>{dis ? "פריט גדול – איסוף בלבד" : s}</span></span>
              {ship === k && <Icon name="CheckCircle2" size={18} style={{ color: "var(--accent)" }} />}</button>))}
        </section>
        <div className="flex items-start gap-2 rounded-2xl p-3 text-xs" style={{ background: "var(--surface-2)", color: "var(--muted)" }}><Icon name="ShieldCheck" size={16} className="shrink-0" style={{ color: "var(--ok)" }} />הכסף מוחזק אצלנו עד שאישרת קבלה. 14 יום להחזרה.</div>
        <button disabled={owned} onClick={() => setSheet({ n: "buy", d, ship, size, total })} className="flex items-center justify-center gap-2 rounded-2xl py-3.5 font-bold disabled:opacity-60" style={{ background: "var(--accent-2)", color: "#1b1036" }}><Icon name="ShoppingBag" size={18} />{owned ? "כבר הזמנת" : `קנה מהארנק · ${ils(total)}`}</button>
      </div>
    );
  };

  const Orders = () => (
    <div className="flex flex-col gap-3">{!orders.length && <Empty icon="Package" t="עוד לא קנית כלום" s="מוצרים שתקנה יופיעו כאן עם מעקב משלוח" />}
      {orders.map((o) => (<div key={o.id} className="rounded-3xl p-4" style={{ background: "var(--surface-2)" }}>
        <div className="flex items-center gap-3"><div className="grid h-12 w-12 place-items-center rounded-2xl" style={{ background: `${o.d.hue}22`, color: o.d.hue }}><Icon name={o.d.icon} /></div>
          <div className="flex-1"><div className="font-bold">{o.d.name}</div><div className="text-xs num" style={{ color: "var(--muted)" }}>{ils(o.total)} · {o.ship === "courier" ? "משלוח" : "איסוף עצמי"}{o.size ? ` · מידה ${o.size}` : ""}</div></div>
          <span className="rounded-full px-2 py-1 text-xs font-bold glow">בדרך</span></div></div>))}</div>
  );
  const Empty = ({ icon, t, s }) => (<div className="grid place-items-center gap-1 rounded-3xl p-8 text-center" style={{ background: "var(--surface-2)" }}><Icon name={icon} size={30} className="opacity-60" /><div className="font-bold">{t}</div><div className="text-sm" style={{ color: "var(--muted)" }}>{s}</div></div>);

  const JobCard = ({ j }) => {
    const st = jobState[j.id];
    return (
      <article onClick={() => push("job", j.id)} className="cursor-pointer rounded-3xl p-4" style={{ background: "var(--surface-2)" }}>
        <div className="flex items-start gap-3">
          <div className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl" style={{ background: "var(--surface)", color: "var(--accent-2)" }}><Icon name={j.icon} /></div>
          <div className="min-w-0 flex-1">
            <div className="flex flex-wrap items-center gap-x-2 text-xs" style={{ color: "var(--muted)" }}><span>{j.cat}</span>{j.urgent && <span className="font-bold" style={{ color: "var(--hot)" }}>· דחוף</span>}<span>· {j.ago}</span></div>
            <h2 className="display font-bold leading-snug">{j.title}</h2>
            <div className="mt-0.5 flex items-center gap-2 text-xs" style={{ color: "var(--muted)" }}><Icon name="MapPin" size={12} />{j.area}{j.km != null && ` · ${j.km} ק״מ`}<Icon name={MODE_ICON[j.mode]} size={12} />{MODE[j.mode]}</div>
          </div>
        </div>
        <div className="mt-3 flex items-center justify-between gap-2">
          <span className={"rounded-full px-3 py-1 text-sm font-bold num " + (j.urgent ? "glow-hot" : "glow")}>{j.kind === "lead" ? "עמלה" : "דמי עבודה"}: {ils(j.fee)}</span>
          {st ? <span className="rounded-full px-3 py-1.5 text-sm font-bold" style={{ background: "var(--surface)", color: "var(--muted)" }}>{STATE_LABEL[st.state]}</span>
            : <button onClick={(e) => { e.stopPropagation(); j.kind === "lead" && j.needs !== "license" ? takeLead(j) : push("job", j.id); }} className="flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-bold" style={{ background: "var(--accent)", color: "#062521" }}><Icon name={j.kind === "lead" ? "Zap" : "Send"} size={15} />{j.kind === "lead" ? "תפוס קריאה" : "שלח הצעה"}</button>}
        </div>
      </article>);
  };

  // ============ sheets ============
  const renderSheet = () => {
    if (!sheet) return null;
    const close = () => setSheet(null);
    if (sheet.n === "notifs") return (
      <Sheet title="התראות" onClose={() => { setNotifs((n) => n.map((x) => ({ ...x, read: true }))); close(); }}>
        <div className="flex flex-col gap-2">{notifs.map((n) => (<div key={n.id} className="flex items-start gap-3 rounded-2xl p-3" style={{ background: n.read ? "var(--surface)" : "color-mix(in srgb, var(--accent) 10%, var(--surface))" }}>
          <Icon name={n.icon} size={18} style={{ color: "var(--accent)" }} /><div className="flex-1 text-sm">{n.t}<div className="text-xs" style={{ color: "var(--muted)" }}>לפני {n.ago}</div></div></div>))}</div></Sheet>);
    if (sheet.n === "post") return <PostSheet close={close} />;
    if (sheet.n === "sell") return <SellSheet close={close} />;
    if (sheet.n === "withdraw") return <WithdrawSheet close={close} />;
    if (sheet.n === "topup") return <TopupSheet close={close} need={sheet.need} />;
    if (sheet.n === "buy") return (
      <Sheet title="אישור רכישה" onClose={close}>
        <div className="font-bold">{sheet.d.name}</div>
        <div className="mt-2 flex flex-col gap-1.5 rounded-2xl p-3 text-sm num" style={{ background: "var(--surface)" }}>
          <Row icon="Tag" label="מחיר" value={ils(sheet.d.price)} /><Row icon="Bike" label="משלוח" value={sheet.ship === "courier" ? ils(25) : "חינם"} />
          <Row icon="Wallet" label="יתרה אחרי" value={ils(balance - sheet.total)} color={balance - sheet.total < 0 ? "var(--hot)" : "var(--accent)"} /></div>
        <button onClick={() => buy(sheet.d, sheet.ship, sheet.size)} className="mt-4 w-full rounded-2xl py-3 font-bold" style={{ background: "var(--accent-2)", color: "#1b1036" }}>אישור וקנייה · {ils(sheet.total)}</button></Sheet>);
    if (sheet.n === "edit") return <EditSheet close={close} />;
    return null;
  };

  const PostSheet = ({ close }) => {
    const [f, setF] = useState({ title: "", cat: "שירותים", mode: "onsite", fee: "", desc: "" });
    return (<Sheet title="פרסם קריאה" onClose={close}>
      <div className="text-xs" style={{ color: "var(--muted)" }}>יש לך לקוח שמחפש שירות? פרסם והקהילה תציע. תקבל עמלת הפניה על כל עבודה שנסגרת.</div>
      <Label>מה צריך?</Label><input id="post-title" className="field" placeholder="למשל: צריך מנעולן" value={f.title} onChange={(e) => setF({ ...f, title: e.target.value })} />
      <Label>תחום</Label><div className="flex flex-wrap gap-2">{["שירותים", "מכירות", "שליחויות"].map((c) => <Chip key={c} on={f.cat === c} onClick={() => setF({ ...f, cat: c })}>{c}</Chip>)}</div>
      <Label>איפה מבצעים</Label><div className="flex gap-2">{Object.entries(MODE).map(([k, v]) => <Chip key={k} on={f.mode === k} onClick={() => setF({ ...f, mode: k })}>{v}</Chip>)}</div>
      <Label>עמלה שתשלם למי שיביא/יבצע (₪)</Label><input id="post-fee" className="field num" inputMode="numeric" value={f.fee} onChange={(e) => setF({ ...f, fee: e.target.value.replace(/\D/g, "") })} />
      <Label>פרטים</Label><textarea id="post-desc" rows={2} className="field" value={f.desc} onChange={(e) => setF({ ...f, desc: e.target.value })} />
      <button disabled={!f.title || !f.fee} onClick={() => { close(); toast("הקריאה פורסמה – נעדכן כשיגיעו הצעות"); notify(`הקריאה "${f.title}" פורסמה`, "Megaphone"); }} className="mt-4 w-full rounded-2xl py-3 font-bold disabled:opacity-50" style={{ background: "var(--accent)", color: "#062521" }}>פרסם</button></Sheet>);
  };
  const SellSheet = ({ close }) => {
    const [f, setF] = useState({ name: "", price: "", was: "", cat: "אלקטרוניקה", cond: "משומש" });
    return (<Sheet title="מכור מוצר" onClose={close}>
      <Label>שם המוצר</Label><input id="sell-name" className="field" value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} />

        <div className="mt-2 flex items-center justify-between rounded-2xl px-3 py-2 num" style={{ background: "var(--surface)" }}><span className="font-bold tracking-widest">MOTI25</span>
          <button onClick={() => { navigator.clipboard?.writeText("MOTI25").catch(() => {}); toast("הקוד הועתק"); }} className="flex items-center gap-1 text-sm font-bold" style={{ color: "var(--accent)" }}><Icon name="Copy" size={14} />העתק</button></div>
        <div className="mt-2 text-xs" style={{ color: "var(--muted)" }}>₪25 לך על כל חבר שמסיים עבודה ראשונה</div>
      </section>
    </div>
  );

  const fab = !top && ((tab === "jobs" && seg === "feed") || tab === "deals");
  return (
    <div className="flex justify-center">
      <div className="relative w-full max-w-[390px] rounded-[44px] p-[10px]" style={{ background: "var(--frame)", boxShadow: "0 30px 80px #000a, inset 0 0 0 2px #2b3146" }}>
        <div dir="rtl" className="relative flex flex-col overflow-hidden rounded-[36px]" style={{ background: "var(--surface)", height: "min(820px, calc(100dvh - 68px))" }}>
          <div className="flex items-center justify-between px-6 pt-3 pb-1 text-xs num"><span className="font-bold">9:41</span>
            <div className="absolute left-1/2 top-2 h-6 w-28 -translate-x-1/2 rounded-full" style={{ background: "#000" }} />
            <span className="flex items-center gap-1"><Icon name="Signal" size={14} /><Icon name="Wifi" size={14} /><Icon name="BatteryFull" size={16} /></span></div>
          <div className="pointer-events-none absolute inset-x-3 top-12 z-50 flex flex-col gap-2" aria-live="polite">
            {toasts.map((t) => (<div key={t.id} className="toast flex items-center gap-2 rounded-2xl px-4 py-3 text-sm font-semibold shadow-xl" style={{ background: t.kind === "err" ? "#3b1520" : "#0f2e2a", color: t.kind === "err" ? "var(--hot)" : "var(--accent)", border: "1px solid var(--line)" }}>
              <Icon name={t.kind === "err" ? "AlertCircle" : "CheckCircle2"} size={18} />{t.text}</div>))}</div>
          <header className="flex items-center gap-2 px-4 pt-2 pb-3">
            {top && <button onClick={back} aria-label="חזרה" className="grid h-9 w-9 place-items-center rounded-full" style={{ background: "var(--surface-2)" }}><Icon name="ArrowRight" size={18} /></button>}
            <h1 className="display flex-1 text-xl font-extrabold">{title}</h1>
            <button onClick={() => setSheet({ n: "notifs" })} aria-label="התראות" className="relative grid h-9 w-9 place-items-center rounded-full" style={{ background: "var(--surface-2)" }}><Icon name="Bell" size={18} />
              {unread > 0 && <span className="absolute -right-0.5 -top-0.5 grid h-4 min-w-4 place-items-center rounded-full px-1 text-[10px] font-bold num" style={{ background: "var(--hot)", color: "#2a0a10" }}>{unread}</span>}</button>
            <button onClick={() => { setStack([]); setTab("wallet"); }} className="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm font-bold num glow"><Icon name="Wallet" size={15} />{ils(balance)}</button>
          </header>
          <main className="scroll flex-1 overflow-y-auto px-4 pb-28">{content}</main>
          {fab && <button onClick={() => setSheet({ n: tab === "jobs" ? "post" : "sell" })} className="absolute bottom-24 left-4 z-20 flex items-center gap-1.5 rounded-full px-4 py-3 text-sm font-bold shadow-xl" style={{ background: tab === "jobs" ? "var(--accent)" : "var(--accent-2)", color: tab === "jobs" ? "#062521" : "#1b1036" }}><Icon name="Plus" size={17} />{tab === "jobs" ? "פרסם קריאה" : "מכור"}</button>}
          {renderSheet()}
          <nav className="absolute inset-x-0 bottom-0 z-30 grid grid-cols-4 px-2 pb-5 pt-2" style={{ background: "color-mix(in srgb, var(--surface) 92%, transparent)", backdropFilter: "blur(12px)", borderTop: "1px solid var(--line)" }}>
            {tabs.map((t) => { const on = tab === t.id && !top; return (
              <button key={t.id} onClick={() => { setTab(t.id); setStack([]); }} aria-current={on ? "page" : undefined} className="flex flex-col items-center gap-1 text-[11px] font-semibold">
                <span className="grid h-8 w-14 place-items-center rounded-full transition" style={{ background: on ? "color-mix(in srgb, var(--accent) 22%, transparent)" : "transparent", color: on ? "var(--accent)" : "var(--muted)" }}><Icon name={t.icon} size={20} /></span>
                <span style={{ color: on ? "var(--fg)" : "var(--muted)" }}>{t.label}</span></button>); })}</nav>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
